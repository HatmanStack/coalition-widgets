<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Coalition data widgets">
  <!--
    The same mark the first site uses, where it is an inline data URI in site/index.html. Two
    sites for one project should not have two different icons in the tab strip, and a solid
    silhouette survives 16px better than anything with interior detail: a roofline over a bar
    chart was drawn for this, and at tab size its bars closed up while this stays a house.

    Deliberately not United Way of the Plains' branding, nor the Coalition's. Every page and
    every payload carries "unaffiliated concept work — not produced, authorised or endorsed by
    United Way of the Plains or the Coalition to End Homelessness", and a favicon is the browser
    tab's answer to whose site this is. A borrowed mark would assert the endorsement the footer
    disclaims, on the same screen.

    Solid tile rather than a transparent glyph, because a favicon sits on browser chrome this has
    no control over and #0044b5 on a dark tab strip is nearly invisible. #0044b5 is the widget
    palette's first series, so the tab icon and the charts are the same system.

    A file here rather than a data URI because this site has a public/ directory and a real
    <link> to point at it, so it caches and stays readable. If it changes, change it in
    site/index.html and site/dashboard.html too — those two carry their own copies.
  -->
  <rect width="32" height="32" rx="6" fill="#0044b5" />
  <path d="M16 6.5 25.5 15H23v10.5h-5V19h-4v6.5H9V15H6.5z" fill="#ffffff" />
</svg>
